name: Update A-share market data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update market data
        run: |
          python scripts/update_market.py

      - name: Check generated database
        run: |
          ls -lh data/

          python - <<'PY'
          import sqlite3

          db = "data/market.db"
          con = sqlite3.connect(db)

          print("=== DATABASE CHECK ===")

          tables = con.execute(
              "select name from sqlite_master where type='table'"
          ).fetchall()

          print("tables:", tables)

          for table in ["stocks", "daily"]:
              try:
                  n = con.execute(
                      f"select count(*) from {table}"
                  ).fetchone()[0]
                  print(table, n)
              except Exception as e:
                  print(table, "ERROR", e)

          con.close()
          PY

      - name: Sync latest main and commit database
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp data/market.db /tmp/market.db

          git fetch origin main

          git reset --hard origin/main

          cp /tmp/market.db data/market.db

          git add data/market.db

          git diff --cached --quiet || \
            git commit -m "Update A-share market data"

          git push origin main
