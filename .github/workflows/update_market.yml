name: Update A-share market data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * 1-5"

permissions:
  contents: write

jobs:
  update-market:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update market data
        run: |
          python scripts/update_market.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 先获取 GitHub 最新 main
          git fetch origin main

          # 以远程 main 为基准，保留本次生成的 data/market.db
          git reset --mixed origin/main

          # 重新加入最新行情数据库
          git add data/

          # 如果有变化就提交
          git diff --cached --quiet || git commit -m "Update A-share market data"

          # 推送到最新 main
          git push origin main
      
      - name: Check generated database
        run: |
            ls -lh data/
            python - <<'PY'
            import sqlite3
            con = sqlite3.connect("data/market.db")
        
            print("tables:")
            print(con.execute(
                "select name from sqlite_master where type='table'"
            ).fetchall())
        
            for table in ["stocks", "daily"]:
                try:
                    n = con.execute(
                        f"select count(*) from {table}"
                    ).fetchone()[0]
                    print(table, n)
                except Exception as e:
                    print(table, e)
        
            con.close()
            PY
