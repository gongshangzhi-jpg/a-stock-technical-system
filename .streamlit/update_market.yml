name: Update A-share market data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update market database
        run: python scripts/update_market.py --days 420 --workers 8
      - name: Commit database
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market.db
          git diff --cached --quiet || git commit -m "data: update A-share market database"
          git push
